<body class="bg-[#F2F2F7]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icon Components ---
        const IconBase = ({ size = 24, className = "", children }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Server = (props) => <IconBase {...props}><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></IconBase>;
        const Cpu = (props) => <IconBase {...props}><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></IconBase>;
        const HardDrive = (props) => <IconBase {...props}><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></IconBase>;
        const Activity = (props) => <IconBase {...props}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></IconBase>;
        const Calendar = (props) => <IconBase {...props}><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></IconBase>;
        const CreditCard = (props) => <IconBase {...props}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></IconBase>;
        const TrendingUp = (props) => <IconBase {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></IconBase>;
        const MessageCircle = (props) => <IconBase {...props}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconBase>;
        const FileText = (props) => <IconBase {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></IconBase>;
        const ChevronDown = (props) => <IconBase {...props}><path d="m6 9 6 6 6-6"/></IconBase>;
        const Globe = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></IconBase>;
        const AlertCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>;
        const RefreshCw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>;
        const Network = (props) => <IconBase {...props}><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></IconBase>;


        // --- UI Components ---

        const Label = ({ children, icon: Icon, rightElement }) => (
            <div className="flex items-center justify-between mb-2.5 ml-1">
                <label className="flex items-center gap-1.5 text-[10px] font-bold tracking-widest text-gray-400 uppercase select-none">
                    {Icon && <Icon size={10} className="stroke-[2.5]" />}
                    {children}
                </label>
                {rightElement}
            </div>
        );

        const InputContainer = ({ children, className = "" }) => (
            <div className={`relative group w-full ${className}`}>
                {children}
            </div>
        );

        const Input = ({ className = "", disabled, ...props }) => (
            <input
                disabled={disabled}
                className={`w-full h-[52px] bg-gray-100/50 hover:bg-gray-100/80 focus:bg-white border-none rounded-xl px-4 text-[15px] font-medium text-[#1C1C1E] placeholder-gray-400/60 shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)] focus:shadow-[inset_0_2px_4px_rgba(0,0,0,0.01),0_0_0_2px_rgba(0,122,255,0.1)] outline-none transition-all duration-300 ease-out min-w-0 disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-gray-100/30 ${className}`}
                {...props}
            />
        );

        const InputWithUnit = ({ 
            type = "text", 
            name, 
            value, 
            onChange, 
            placeholder, 
            unitName, 
            unitValue, 
            unitOptions, 
            onUnitChange,
            unitWidth = "w-24",
            disabled = false
        }) => {
            return (
                <div className={`flex w-full h-[52px] bg-gray-100/50 hover:bg-gray-100/80 focus-within:bg-white rounded-xl shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)] focus-within:shadow-[inset_0_2px_4px_rgba(0,0,0,0.01),0_0_0_2px_rgba(0,122,255,0.1)] transition-all duration-300 ease-out overflow-hidden ${disabled ? 'opacity-50 cursor-not-allowed bg-gray-100/30' : ''}`}>
                    <input
                        type={type}
                        name={name}
                        value={value}
                        onChange={onChange}
                        placeholder={placeholder}
                        disabled={disabled}
                        className="flex-1 h-full bg-transparent border-none px-4 text-[15px] font-medium text-[#1C1C1E] placeholder-gray-400/60 outline-none min-w-0 disabled:cursor-not-allowed"
                    />
                    
                    {/* Vertical Divider */}
                    <div className="w-px bg-gray-200 my-2 shrink-0"></div>
                    
                    <div className={`relative shrink-0 ${unitWidth} h-full`}>
                        <select
                            name={unitName}
                            value={unitValue}
                            onChange={onUnitChange}
                            disabled={disabled}
                            className="w-full h-full appearance-none bg-transparent border-none pl-3 pr-7 text-[13px] font-bold text-gray-500 cursor-pointer outline-none hover:text-[#1C1C1E] transition-colors truncate disabled:cursor-not-allowed"
                        >
                            {unitOptions.map((opt) => (
                                <option key={opt.value} value={opt.value}>
                                    {opt.label}
                                </option>
                            ))}
                        </select>
                        <ChevronDown className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" size={14} />
                    </div>
                </div>
            );
        };

        const Select = ({ options, className = "", ...props }) => (
            <div className={`relative ${className}`}>
                <select
                    className="w-full h-full appearance-none bg-gray-100/50 hover:bg-gray-100/80 focus:bg-white border-none rounded-xl pl-4 pr-9 text-[15px] font-medium text-[#1C1C1E] shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)] outline-none transition-all duration-300 ease-out cursor-pointer"
                    {...props}
                >
                    {options.map((opt) => (
                        <option key={opt.value} value={opt.value}>
                            {opt.label}
                        </option>
                    ))}
                </select>
                <ChevronDown className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" size={16} />
            </div>
        );

        const Button = ({ children, variant = 'primary', className = "", isLoading = false, ...props }) => {
            const baseStyle = "w-full rounded-[24px] font-semibold text-[15px] tracking-wide transition-all duration-300 flex items-center justify-center gap-2 active:scale-[0.98] cursor-pointer select-none";
            const variants = {
                primary: "bg-[#1C1C1E] text-white hover:bg-black shadow-[0_8px_20px_-6px_rgba(0,0,0,0.2)] hover:shadow-[0_12px_24px_-8px_rgba(0,0,0,0.3)] py-4",
                secondary: "bg-white text-[#1C1C1E] border border-gray-200/50 hover:border-gray-300/80 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)] hover:shadow-[0_4px_12px_-4px_rgba(0,0,0,0.08)] py-3",
            };

            return (
                <button 
                    className={`${baseStyle} ${variants[variant]} ${className} ${isLoading ? 'opacity-80 cursor-wait' : ''}`} 
                    disabled={isLoading}
                    {...props}
                >
                    {isLoading && <RefreshCw size={16} className="animate-spin" />}
                    {children}
                </button>
            );
        };

        const Toast = ({ message, onClose }) => (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 animate-in fade-in slide-in-from-top-4 duration-300 w-[90%] max-w-sm">
                <div className="bg-[#1C1C1E]/95 backdrop-blur-md text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/10">
                    <AlertCircle size={20} className="text-red-400 shrink-0" />
                    <span className="text-sm font-medium leading-tight">{message}</span>
                </div>
            </div>
        );

        // --- Main App Logic ---

        function App() {
            // State
            const [formData, setFormData] = useState({
                vpsName: '',
                cores: '',
                memory: '',
                memoryUnit: 'GB',
                storage: '',
                storageUnit: 'GB',
                bandwidth: '',
                bandwidthUnit: 'Mbps',
                traffic: '',
                trafficUnit: 'GB',
                isUnlimitedTraffic: false,
                subscriptionType: 'monthly',
                price: '',
                currency: 'CNY',
                startDate: '',
                premium: '',
                contactMethod: 'none',
                contactInfo: '',
                reviewUrl: '',
                country: ''
            });

            const [result, setResult] = useState(null);
            const [endDate, setEndDate] = useState('');
            const [rates, setRates] = useState({});
            const [currentRate, setCurrentRate] = useState(null);
            const [loadingRate, setLoadingRate] = useState(false);
            const [error, setError] = useState('');
            const [qrCodeDataUrl, setQrCodeDataUrl] = useState('');
const [countries, setCountries] = useState([]);
const [countryDropdownOpen, setCountryDropdownOpen] = useState(false);
const [countrySearch, setCountrySearch] = useState('');
            const svgRef = useRef(null);
            const qrContainerRef = useRef(null);

            // --- Load Countries Data ---
            useEffect(() => {
                fetch('https://gist.githubusercontent.com/mouse0232/5bb03394be98b6616692db1b1ca3ed46/raw/fc99e5b376901826b1f90fcd3a31c252b2d3e4b3/countries.json')
                    .then(res => res.json())
                    .then(data => {
                        // Sort by country code to ensure 'CN' is near the top
                        const sorted = [...data].sort((a, b) => a.code.localeCompare(b.code));
                        setCountries(sorted);
                    })
                    .catch(err => console.error('Failed to load countries', err));
            }, []);

            // --- Multi-language Support ---
            // Detect browser language to determine if Chinese should be used
            const isZh = navigator.language && navigator.language.startsWith('zh');

            const labels = {
                reportTitle: isZh ? "剩余价值评估报告" : "Residual Value Assessment Report",
                configuration: isZh ? "配置" : "CONFIGURATION",
                network: isZh ? "网络" : "NETWORK",
                subscription: isZh ? "订阅" : "SUBSCRIPTION",
                contact: isZh ? "联系方式" : "CONTACT",
                dates: isZh ? "日期" : "DATES",
                start: isZh ? "开始:" : "Start:",
                end: isZh ? "结束:" : "End:",
                scanReview: isZh ? "👇扫码查看测评" : "👇 Scan to view review",
                totalValue: isZh ? "总价值" : "TOTAL VALUE",
            };

            // Constants
            const subscriptionOptions = [
                { value: 'monthly', label: '月付', labelEn: 'Monthly' },
                { value: 'quarterly', label: '季付', labelEn: 'Quarterly' },
                { value: 'semiannual', label: '半年付', labelEn: 'Semi-Annual' },
                { value: 'yearly', label: '年付', labelEn: 'Annual' },
                { value: 'biennial', label: '两年付', labelEn: '2-Year' },
                { value: 'triennial', label: '三年付', labelEn: '3-Year' },
                { value: 'quinquennial', label: '五年付', labelEn: '5-Year' },
            ];

            const currencyOptions = [
                { value: 'CNY', label: 'CNY (人民币)' },
                { value: 'USD', label: 'USD (美元)' },
                { value: 'EUR', label: 'EUR (欧元)' },
                { value: 'SGD', label: 'SGD (新加坡元)' },
                { value: 'GBP', label: 'GBP (英镑)' },
                { value: 'JPY', label: 'JPY (日元)' },
                { value: 'RUB', label: 'RUB (卢布)' },
            ];

            const contactOptions = [
                { value: 'none', label: '无联系方式' },
                { value: 'tg', label: 'Telegram' },
                { value: 'wechat', label: 'WeChat' },
                { value: 'message', label: '站内私信' },
            ];

            // Helper to get symbol
            const getCurrencySymbol = (code) => {
                const symbols = { CNY:'¥', USD:'$', EUR:'€', GBP:'£', JPY:'¥', RUB:'₽', SGD:'S$' };
                return symbols[code] || code;
            };

            // Effects
            useEffect(() => {
                if (error) {
                    const timer = setTimeout(() => setError(''), 3000);
                    return () => clearTimeout(timer);
                }
            }, [error]);

            useEffect(() => {
                if (formData.startDate) {
                    const start = new Date(formData.startDate);
                    const end = new Date(start);
                    
                    switch (formData.subscriptionType) {
                        case 'monthly': end.setMonth(end.getMonth() + 1); break;
                        case 'quarterly': end.setMonth(end.getMonth() + 3); break;
                        case 'semiannual': end.setMonth(end.getMonth() + 6); break;
                        case 'yearly': end.setFullYear(end.getFullYear() + 1); break;
                        case 'biennial': end.setFullYear(end.getFullYear() + 2); break;
                        case 'triennial': end.setFullYear(end.getFullYear() + 3); break;
                        case 'quinquennial': end.setFullYear(end.getFullYear() + 5); break;
                        default: break;
                    }
                    setEndDate(end.toISOString().split('T')[0]);
                } else {
                    setEndDate('');
                }
            }, [formData.startDate, formData.subscriptionType]);

            useEffect(() => {
                if (formData.currency !== 'CNY') {
                    const fetchRate = async (curr) => {
                        setLoadingRate(true);
                        setCurrentRate(null);
                        try {
                            const res = await fetch(`https://open.er-api.com/v6/latest/${curr}`);
                            const data = await res.json();
                            
                            if (data && data.rates && data.rates.CNY) {
                                const rateToCNY = data.rates.CNY;
                                setRates(prev => ({ ...prev, [curr]: rateToCNY }));
                                setCurrentRate(rateToCNY);
                            }
                        } catch (e) {
                            console.error("Rate fetch error", e);
                        } finally {
                            setLoadingRate(false);
                        }
                    };
                    fetchRate(formData.currency);
                } else {
                    setCurrentRate(null);
                }
            }, [formData.currency]);

            // Handlers
            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                const val = type === 'checkbox' ? checked : value;
                setFormData(prev => ({ ...prev, [name]: val }));
            };

            const validateInputs = () => {
                const required = ['vpsName', 'cores', 'memory', 'storage', 'bandwidth', 'price', 'startDate'];
                for (const field of required) {
                    if (!formData[field]) return false;
                }
                // Check traffic if not unlimited
                if (!formData.isUnlimitedTraffic && !formData.traffic) return false;
                
                return true;
            };

            const calculate = () => {
                if (!validateInputs()) {
                    setError('请填写所有必填项 (VPS名称、配置、流量、价格、开始日期)');
                    return;
                }
                if (!endDate) {
                    setError('日期计算错误，请重新选择开始日期');
                    return;
                }
                const start = new Date(formData.startDate);
                const end = new Date(endDate);
                const now = new Date();
                const totalDuration = end - start;
                if (totalDuration <= 0) {
                    setError('结束日期必须晚于开始日期');
                    return;
                }
                const timeDiff = now - start;
                const totalDays = totalDuration / (1000 * 60 * 60 * 24);
                const daysPassed = timeDiff / (1000 * 60 * 60 * 24);
                
                let remainingRatio = (totalDays - daysPassed) / totalDays;
                if (remainingRatio < 0) remainingRatio = 0;
                if (remainingRatio > 1) remainingRatio = 1;

                let baseValue = remainingRatio * parseFloat(formData.price);
                const premium = parseFloat(formData.premium) || 0;
                const totalValue = baseValue + premium;

                let convertedText = '';
                if (formData.currency !== 'CNY') {
                    const rate = currentRate || rates[formData.currency];
                    if (rate) {
                        const cnyVal = (totalValue * rate).toFixed(2);
                        convertedText = `≈ ¥${cnyVal}`;
                    }
                }

                setResult({
                    value: totalValue.toFixed(2),
                    currency: formData.currency,
                    converted: convertedText,
                    rate: currentRate
                });

                // Generate QR code if reviewUrl is provided
                if (formData.reviewUrl && qrContainerRef.current) {
                    qrContainerRef.current.innerHTML = '';
                    const qr = new QRCode(qrContainerRef.current, {
                        text: formData.reviewUrl,
                        width: 120,
                        height: 120,
                        colorDark: "#1C1C1E",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                    // Wait for QR code to render, then extract as data URL
                    setTimeout(() => {
                        const canvas = qrContainerRef.current.querySelector('canvas');
                        if (canvas) {
                            setQrCodeDataUrl(canvas.toDataURL('image/png'));
                        }
                    }, 100);
                } else {
                    setQrCodeDataUrl('');
                }
            };

            const saveImage = () => {
                if (!svgRef.current) return;
                
                const exportCard = (flagBase64) => {
                    let svgData = new XMLSerializer().serializeToString(svgRef.current);
                    
                    // If we have a Base64 flag, inject it into the SVG string to avoid CORS issues during export
                    if (flagBase64) {
                        const flagUrl = `https://flagcdn.com/${formData.country.toLowerCase()}.svg`;
                        svgData = svgData.replace(flagUrl, flagBase64);
                    }

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(svgBlob);
                    
                    img.onload = () => {
                        const width = 800;
                        const height = 600;
                        canvas.width = width;
                        canvas.height = height;
                        ctx.fillStyle = "#F2F2F7"; 
                        ctx.fillRect(0,0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            const link = document.createElement('a');
                            link.href = URL.createObjectURL(blob);
                            link.download = `VPS_Valuation_${formData.vpsName || 'Card'}.webp`;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                        }, 'image/webp');
                    };
                    img.src = url;
                };

                // Pre-fetch flag as Base64 to ensure it renders in the exported image
                if (formData.country) {
                    const flagUrl = `https://flagcdn.com/${formData.country.toLowerCase()}.svg`;
                    fetch(flagUrl)
                        .then(res => res.blob())
                        .then(blob => {
                            const reader = new FileReader();
                            reader.onloadend = () => {
                                exportCard(reader.result); // reader.result contains "data:image/svg+xml;base64,..."
                            };
                            reader.readAsDataURL(blob);
                        })
                        .catch(() => exportCard(null)); // Fallback if fetch fails
                } else {
                    exportCard(null);
                }
            };

                const contactMethodLabel = formData.contactMethod === 'none' 
                    ? (isZh ? '无' : 'None')

                // Markdown Content Construction
                const countryData = countries.find(c => c.code === formData.country);
                // Use 20x15 PNG for better Markdown compatibility and small size
                const countryImgUrl = formData.country ? `https://flagcdn.com/20x15/${formData.country.toLowerCase()}.png` : null;
                const countryDisplay = countryData

## ${isZh ? '基本信息' : 'Basic Info'}
- ${isZh ? '名称' : 'Name'}: ${formData.vpsName || '-'}
- ${isZh ? '国家/地区' : 'Country/Region'}: ${countryDisplay}

## ${isZh ? '配置' : 'Configuration'}
- ${isZh ? 'CPU' : 'CPU'}: ${formData.cores || '-'} C
- ${isZh ? '内存' : 'RAM'}: ${formData.memory || '-'} ${formData.memoryUnit}
- ${isZh ? '硬盘' : 'Storage'}: ${formData.storage || '-'} ${formData.storageUnit} DISK

## ${isZh ? '网络' : 'Network'}
- ${isZh ? '带宽' : 'Bandwidth'}: ${formData.bandwidth || '-'} ${formData.bandwidthUnit}
- ${isZh ? '流量' : 'Traffic'}: ${formData.isUnlimitedTraffic ? (isZh ? '无限流量' : 'Unlimited Traffic') : (formData.traffic || '-') + ' ' + formData.trafficUnit}

## ${isZh ? '订阅' : 'Subscription'}
- ${isZh ? '周期' : 'Cycle'}: ${subLabel}
- ${isZh ? '价格' : 'Price'}: ${formData.price || '-'} ${formData.currency}
${formData.premium ? `- ${isZh ? '溢价' : 'Premium'}: ${formData.premium} ${formData.currency}` : ''}

## ${isZh ? '日期' : 'Dates'}
- ${isZh ? '开始' : 'Start'}: ${formData.startDate || '-'}
- ${isZh ? '结束' : 'End'}: ${endDate || '-'}

## ${isZh ? '联系方式' : 'Contact'}
- ${isZh ? '方式' : 'Method'}: ${contactMethodLabel}
- ${isZh ? 'ID' : 'ID'}: ${contactInfoDisplay}

## ${isZh ? '测评报告' : 'Review'}
- ${isZh ? '网址' : 'URL'}: ${formData.reviewUrl || '-'}

## ${isZh ? '估值结果' : 'Valuation Result'}
- ${isZh ? '剩余价值' : 'Remaining Value'}: ${result ? `${getCurrencySymbol(result.currency)}${result.value}` : '-'}`;

                const blob = new Blob([mdContent], { type: 'text/markdown' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `VPS_Valuation_${formData.vpsName || 'Report'}.md`;
                document.body.appendChild(link);
                link.click();

            };

                            <text x="100" y="120" fontFamily="Inter, sans-serif" fontWeight="800" fontSize="32" fill="#1C1C1E">{formData.vpsName || '未命名 VPS'}</text>
                            
                            {/* Country Flag Image - Positioned on the right */}
                            {formData.country && countries.length > 0 && (
                                <image 
                                    x="660" 
                                    y="85" 
                                    width="40" 
                                    height="27" 
                                    href={`https://flagcdn.com/${formData.country.toLowerCase()}.svg`}
                                    crossOrigin="anonymous"
                                    preserveAspectRatio="xMidYMid meet"
                                />
                            )}
                            
                            <text x="100" y="150" fontFamily="Inter, sans-serif" fontSize="16" fill="#888">{labels.reportTitle}</text>

                            {/* Left Column - Configuration, Network, Subscription, Contact */}
                            <g transform="translate(100, 200)">
                                <text x="0" y="0" fontFamily="Inter, sans-serif" fontSize="12" fontWeight="bold" fill="#AAA" letterSpacing="1">{labels.configuration}</text>
                                <text x="0" y="25" fontFamily="Inter, sans-serif" fontSize="18" fill="#333">
                                    {formData.cores || '-'} C / {formData.memory || '-'}{formData.memoryUnit} RAM / {formData.storage || '-'}{formData.storageUnit} DISK
                                </text>
                                
                                <text x="0" y="60" fontFamily="Inter, sans-serif" fontSize="12" fontWeight="bold" fill="#AAA" letterSpacing="1">{labels.network}</text>
                                <text x="0" y="85" fontFamily="Inter, sans-serif" fontSize="18" fill="#333">
                                    {formData.bandwidth || '-'}{formData.bandwidthUnit} Bandwidth / {formData.isUnlimitedTraffic ? 'Unlimited' : (formData.traffic || '-') + formData.trafficUnit} Traffic
                                </text>

                                <text x="0" y="120" fontFamily="Inter, sans-serif" fontSize="12" fontWeight="bold" fill="#AAA" letterSpacing="1">{labels.subscription}</text>
                                <text x="0" y="145" fontFamily="Inter, sans-serif" fontSize="18" fill="#333">
                                    {formData.price} {formData.currency} / {subscriptionOptions.find(o => o.value === formData.subscriptionType)?.[isZh ? 'label' : 'labelEn']}
                                </text>

                                {formData.contactMethod !== 'none' && (
                                    <>
                                        <text x="0" y="180" fontFamily="Inter, sans-serif" fontSize="12" fontWeight="bold" fill="#AAA" letterSpacing="1">{labels.contact}</text>
                                        <text x="0" y="205" fontFamily="Inter, sans-serif" fontSize="16" fill="#555">
                                            {formData.contactMethod === 'tg' ? 'Telegram' : formData.contactMethod === 'wechat' ? 'WeChat' : 'Message'}: {formData.contactInfo}
                                        </text>
                                    </>
                                )}
                            </g>

                            {/* Right Column - Dates and QR Code */}
                            <g transform="translate(450, 200)">
                                <text x="0" y="0" fontFamily="Inter, sans-serif" fontSize="12" fontWeight="bold" fill="#AAA" letterSpacing="1">{labels.dates}</text>
                                <text x="0" y="25" fontFamily="Inter, sans-serif" fontSize="16" fill="#555">{labels.start} {formData.startDate || '-'}</text>
                                <text x="0" y="50" fontFamily="Inter, sans-serif" fontSize="16" fill="#555">{labels.end} {endDate || '-'}</text>
                                
                                {formData.reviewUrl && qrCodeDataUrl && (
                                    <>
                                        <text x="0" y="90" fontFamily="Inter, sans-serif" fontSize="12" fontWeight="bold" fill="#AAA" letterSpacing="1">{labels.scanReview}</text>
                                        <image 
                                            x="0" 
                                            y="105" 
                                            width="110" 
                                            height="110" 
                                            href={qrCodeDataUrl}
                                        />
                                    </>
                                )}
                            </g>

                            <line x1="100" y1="440" x2="700" y2="440" stroke="#EEE" strokeWidth="2" />

                            <text x="100" y="510" fontFamily="Inter, sans-serif" fontSize="14" fontWeight="bold" fill="#AAA" letterSpacing="2">{labels.totalValue}</text>
                            
                            {/* Updated Result Display in SVG to include converted price */}
                            {result && (
                                <text x="700" y="515" fontFamily="Inter, sans-serif" textAnchor="end">
                                    {/* Main Price */}
                                    <tspan fontSize="48" fontWeight="800" fill="#1C1C1E">
                                        {getCurrencySymbol(result.currency)}{result.value}
                                    </tspan>
                                    
                                    {/* Converted Price (Smaller & Lighter) */}
                                    {result.converted && (
                                        <tspan fontSize="24" fontWeight="500" fill="#8E8E93" dx="16">
                                            {result.converted}
                                        </tspan>
                                    )}
                                </text>
                            )}
                        </svg>
                    </div>

                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
